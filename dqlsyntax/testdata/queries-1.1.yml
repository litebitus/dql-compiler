# Every `written` here is read twice: grammar/1.1.ebnf must admit it, and the
# parser must take it. `refused` holds what both turn away, with the words the
# parser's refusal carries.

admitted:
  filter:
    - ""
    - mock
    - '"a mock phrase"'
    - job:mock-api
    - 'job:"mock api"'
    - job:mock*
    - job:*
    - latency_ms >= 100
    - latency_ms <= 100
    - latency_ms > 5
    - latency_ms < 5
    - job:(mock-api or mock-worker)
    - job:(mock-api and not mock-worker)
    - 'items:{ name:mock }'

  variable:
    - env:${env}
    - job:mock-${env}-*
    - job:(${job} or mock-api)

  combination:
    - job:mock-api and env:mock
    - job:mock-api or env:mock
    - not job:mock-api
    - (job:mock-api or job:mock-worker) and env:mock
    - job:mock-api AND env:mock

  escape:
    - 'path:mock\:value'
    - 'message:"a \"quoted\" word"'
    - 'message:mock\|value'
    - 'message:\or'

  shaping:
    - app:mock | dedup(trace_id)
    - app:mock | eval(seconds = latency_ms / 1000)
    - app:mock | eval(seconds = (latency_ms + 1) * 2)
    - 'app:mock | extract(message, "id=(?P<id>\\w+)")'
    - app:mock | fields(app, message)
    - app:mock | rename(message, line)

  time:
    - __name__:mock_requests_total | rate(5m)
    - __name__:mock_requests_total | rate(1h30m)
    - app:mock | per_second(1m) by app

  statistic:
    - __name__:mock_requests_total | rate(5m) | sum() by job
    - app:mock | per_second(1m) by app | avg() by app
    - app:mock | avg(latency_ms) by app
    - app:mock | count()
    - app:mock | distinct_count(user) by app
    - __name__:mock_up | max()
    - app:mock | min(latency_ms)
    - __name__:mock_latency_bucket | rate(5m) | quantile(0.95) by job, env
    - app:mock | quantile(0.5, latency_ms)
    - app:mock | stdev(latency_ms)
    - __name__:mock_requests_total | rate(5m) | sum() by job | max()

  result:
    - __name__:mock_up | topk(5) by job
    - __name__:mock_up | bottomk(3)
    - __name__:mock_up | sort(value)
    - app:mock | sort_desc(app)
    - app:mock | limit(10)
    - __name__:mock_up | where(value > 5)
    - __name__:mock_up | where(value >= 5)
    - __name__:mock_up | where(value < 5)
    - __name__:mock_up | where(value <= 5)
    - __name__:mock_up | where(value == 1)
    - __name__:mock_up | where(value != 1)
    - __name__:mock_up | where(value == 0) | count() by job
    - __name__:mock_up | count() by job | where(value > 1) | sum()

  arithmetic:
    - (status:5* | per_second(5m) by job) / (status:* | per_second(5m) by job) * 100
    - (app:mock | rate(5m) | sum()) + (app:other | rate(5m) | sum())
    - (app:mock | rate(5m) | sum()) - 0.5
    - (app:mock | count()) + (app:other | count()) + (app:third | count())
    - '(app:mock | extract(message, "a)") | count()) / 2'
    - '(app:mock | extract(message, "a|b") | count()) / 2'
    - (app:\| | count()) / 2

  now:
    - (__name__:mock_expiry_seconds | min() by host) - now()
    - now() - (__name__:mock_start_seconds | max() by host)
    - (__name__:mock_expiry_seconds | min()) - NOW() / 86400

refused:
  - written: (a or b
    says: a parenthesis is not closed
  - written: '"open'
    says: a quote is not closed
  - written: 'level:'
    says: the query ends early
  - written: 'app:)'
    says: a field needs a value, not ")"
  - written: attempt >
    says: a range on attempt needs a value
  - written: a and
    says: the query ends early
  - written: a)
    says: unexpected ")"
  - written: and a
    says: unexpected "and"
  - written: not
    says: the query ends early
  - written: app:a or or b
    says: unexpected "or"
  - written: 'items:{ name:mock'
    says: a brace is not closed
  - written: env:$env
    says: write a variable as ${env}, not $env
  - written: env:${env
    says: a variable is written ${name}, its name letters, digits and underscores
  - written: env:${env-x}
    says: a variable is written ${name}, its name letters, digits and underscores
  - written: app:mock | median()
    says: unknown function "median"
  - written: __name__:mock_up | sum() | rate(5m)
    says: '"rate" cannot follow "sum"'
  - written: __name__:mock_up | rate(5m) | rate(1m)
    says: '"rate" cannot follow "rate"'
  - written: __name__:mock_up | where(value == 0) | rate(5m)
    says: '"rate" cannot follow "where"'
  - written: __name__:mock_up | topk(5) | where(value > 1) | sum()
    says: '"sum" cannot follow "where"'
  - written: __name__:mock_up | rate()
    says: '"rate" needs a duration, not ")"'
  - written: __name__:mock_up | topk(1.5)
    says: '"topk" needs a whole number, not "1.5"'
  - written: __name__:mock_up | where(value 5)
    says: '"where" needs a comparison operator, not "5"'
  - written: app:mock | eval(seconds latency_ms)
    says: '"eval" needs "=", not "latency_ms"'
  - written: app:mock | count(
    says: a parenthesis is not closed
  - written: app:mock | count() by
    says: '"by" needs a field, not end of query'
  - written: app:mock | count() app
    says: unexpected "app"
  - written: (app:mock | count()) / (app:other)
    says: arithmetic combines queries that answer time series
  - written: (app:mock | count()) / app:other
    says: arithmetic needs a query in parentheses, a number or now(), not "app:other"
  - written: (app:mock | count()) - now
    says: arithmetic needs a query in parentheses, a number or now(), not "now"
  - written: (app:mock | count()) - now(
    says: arithmetic needs a query in parentheses, a number or now(), not "now"
  - written: (app:mock | count()) / (app:mock | count()
    says: a parenthesis is not closed
  - written: app:mock | 5
    says: a stage needs a function, not "5"
  - written: app:mock | count x
    says: '"count" needs "(", not "x"'
  - written: app:mock | fields()
    says: '"fields" needs a field, not ")"'
  - written: app:mock | eval(x = )
    says: '"eval" needs a field or a number, not ")"'
  - written: app:mock | eval(x = (latency_ms + 1)
    says: a parenthesis is not closed
  - written: latency_ms > "open
    says: a range on latency_ms needs a value
  - written: (app:mock | count()) / ("open
    says: a quote is not closed
  - written: (app:mock | count()) / "open
    says: a quote is not closed
  - written: a or "open
    says: a quote is not closed
  - written: a and "open
    says: a quote is not closed
  - written: not "open
    says: a quote is not closed
  - written: ("open
    says: a quote is not closed
  - written: app:"open
    says: a quote is not closed
  - written: app:("open
    says: a quote is not closed
  - written: app:(a or "open
    says: a quote is not closed
  - written: app:(a and "open
    says: a quote is not closed
  - written: app:(not "open
    says: a quote is not closed
  - written: items:{ "open
    says: a quote is not closed
  - written: a "open
    says: a quote is not closed
  - written: app:mock | "open
    says: a quote is not closed
  - written: app:mock | count "open
    says: a quote is not closed
  - written: app:mock | rate("open
    says: a quote is not closed
  - written: app:mock | rate(5m "open
    says: a quote is not closed
  - written: app:mock | count() by "open
    says: a quote is not closed
  - written: app:mock | eval("open
    says: a quote is not closed
  - written: app:mock | eval(x "open
    says: a quote is not closed
  - written: app:mock | eval(x = latency_ms "open
    says: a quote is not closed
  - written: app:mock | topk("open
    says: a quote is not closed
  - written: app:mock | quantile(0.5 "open
    says: a quote is not closed
  - written: app:mock | where("open
    says: a quote is not closed
  - written: app:mock | where(value "open
    says: a quote is not closed
  - written: app:mock | where(value > "open
    says: a quote is not closed
  - written: app:mock | sort("open
    says: a quote is not closed
  - written: app:mock | extract(message "open
    says: a quote is not closed
